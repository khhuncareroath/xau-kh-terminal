name: Daily backtest
on:
  schedule:
    - cron: "37 21 * * 1-5"   # after the New York close (21:37 UTC = 04:37 Phnom Penh)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-backtest        # separate from the live runner, which stays busy for hours at a time
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # years of spot XAUUSD from Dukascopy, kept in the Actions cache (too big to commit every day)
      - uses: actions/cache@v4
        with:
          path: data/xau_5m.csv.gz
          key: xau-spot-${{ github.run_id }}
          restore-keys: xau-spot-
      - run: python dukascopy.py --check
      - run: python dukascopy.py          # first run: up to 2 years; it saves as it goes and stops after 25 min, then continues next run
      - name: Save the downloaded history now (even if a later step fails)
        uses: actions/cache/save@v4
        with:
          path: data/xau_5m.csv.gz
          key: xau-spot-${{ github.run_id }}-dl
      - run: python history.py            # futures candles too, for comparison
        continue-on-error: true
      - name: Backtest on spot history
        run: python backtest.py
        env:
          XAU_SOURCE: spot
      - name: Attach the data so you can download it from this run's page
        uses: actions/upload-artifact@v4
        with:
          name: xau-history
          path: |
            data/xau_5m.csv.gz
            backtest.json
          retention-days: 14
      - name: Save results
        run: |
          git config --global user.name "analysis-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add backtest.json; git add data/gc_5m.csv.gz 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "Daily backtest"
          for i in 1 2 3; do git pull --rebase -X theirs origin HEAD && git push && exit 0; sleep 10; done
          exit 1

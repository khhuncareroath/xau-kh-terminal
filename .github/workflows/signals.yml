name: Gold analysis
on:
  schedule:
    # Only restarts the runner. loop.py itself runs the analysis every 5 minutes for up to 5.5 hours,
    # because GitHub delays scheduled jobs (a "*/5" schedule really ran about once an hour).
    - cron: "*/20 * * * 0-5"
  workflow_dispatch:
permissions:
  contents: write
  actions: write     # lets the runner start its own next shift, so there is no gap between shifts
concurrency:
  group: gold-analysis
  cancel-in-progress: false   # a new start waits until the running loop ends, so there is never a gap or an overlap
env:
  XAU_RULES: ${{ vars.XAU_RULES || 'current' }}
  DISPLAY_TZ: ${{ vars.DISPLAY_TZ || 'Asia/Phnom_Penh' }}
  ALERT_MODE: ${{ vars.ALERT_MODE || 'auto' }}          # auto = trade-style alerts only after backtest.json proves the rules
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
  TELEGRAM_GROUP_ID: ${{ vars.TELEGRAM_GROUP_ID || secrets.TELEGRAM_GROUP_ID }}   # optional: group with Topics = sections
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  SITE_URL: ${{ vars.SITE_URL }}
  SCALP: ${{ vars.SCALP || 'on' }}                      # ⚡ scalp after a tested 4H breakout; 'off' stops it
  FUN_SCALP: ${{ vars.FUN_SCALP || 'on' }}              # 🎰 fun scalps in their own topic; 'off' stops them
  VOLUME_SIGNALS: ${{ vars.VOLUME_SIGNALS || 'on' }}    # 📊 volume-profile A+ entries in 📈 Signals; 'off' stops them
  BPLUS_SIGNALS: ${{ vars.BPLUS_SIGNALS || 'on' }}      # 📈 B+ M15 signals (with the other-side check); off = A+ only
  SPLUS: ${{ vars.SPLUS || 'off' }}                     # 'on' brings back the S+ ICT setup
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: AI-written "Why" lines
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # optional, free tier: breaking news in Khmer
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || '' }}
  AI_LANG: ${{ vars.AI_LANG || 'en' }}                  # 'km' adds a Khmer version
  BOT_LANG: ${{ vars.BOT_LANG || 'en' }}                # Telegram alerts: en, km or both
  TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}         # optional: spot XAUUSD offset in alerts
  PYTHONWARNINGS: ignore
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure git for the bot
        run: |
          git config --global user.name "analysis-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      - name: Restore the spot XAUUSD history
        run: |
          mkdir -p data
          git fetch -q --depth 1 origin spot-data && git show FETCH_HEAD:xau_5m.csv.gz > data/xau_5m.csv.gz && echo "spot history restored" || echo "no spot history, recent data only"
      - name: Analysis every 5 minutes
        run: python loop.py
      - name: Start the next shift right away
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # loop.py leaves this flag only when the market is open, so weekends do not restart in a loop
          if [ -f data/cache/next_shift ]; then gh workflow run signals.yml --ref "${GITHUB_REF_NAME}" || echo "could not start the next shift; the schedule will"; else echo "market closed: the schedule restarts on Sunday"; fi

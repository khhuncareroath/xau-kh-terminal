name: Gold analysis
on:
  schedule:
    - cron: "*/15 * * * 0-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-analysis
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # core steps: if one fails the job fails loudly and status.py tells the owner
      - run: python levels.py
      - run: python ict.py
      - run: python confluence.py
      # optional steps: the site works without them
      - run: python news.py
        continue-on-error: true
      - run: python macro.py
        continue-on-error: true
      - run: python quality.py
        continue-on-error: true
      - run: python grade.py
        continue-on-error: true
      - run: python notify.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Health check
        if: always()
        run: python status.py
        env:
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save results
        if: always()
        run: |
          git config --global user.name "analysis-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add -- '*.json'
          git diff --staged --quiet || (git commit -m "Update analysis live data" && git pull --rebase -X theirs origin HEAD && git push)

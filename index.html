const G=[["ICT · where price is drawn",[
["liq","Liquidity: the fuel","Liquidity is clusters of resting orders: stop-losses above old highs and below old lows, plus breakout entries. Equal highs/lows and previous day/session extremes are the obvious pools.","Large players need a counterparty. To buy 1,000 lots without moving price against themselves, they need many sellers at once. Retail stop-losses below a low are forced sell orders, so that low is where big buyers can fill.","Look for equal lows, previous day/week highs and lows, Asia range extremes. If many traders would put a stop there, it is a pool.","Mark pools first. Price tends to travel from one pool to the next. Never place your own stop right on an obvious pool.",()=>`Sell-side liquidity sat under the earlier lows near ${f(SWP)}. Price was drawn there before it could rally.`,"sweep"],
["sweep","Liquidity sweep (stop run)","A quick poke through a pool that closes back inside. The wick takes the stops, the close shows rejection.","Stops triggering below a low become market sells, which hands large buyers the liquidity they wanted. Once the orders are absorbed, selling pressure disappears and price snaps back.","Wick beyond the level, then a close back above it within 1–3 candles, ideally on a volume spike.","A sweep alone is not an entry. It is permission to look for a shift in structure (next lesson).",()=>`Candle 36 wicked to ${f(SWP)}, below the prior lows, then closed back above at ${f(C[36].c)} on heavy volume. That is the stop run.`,"sweep"],
["mss","Market Structure Shift (MSS)","Price closes beyond the last swing high (for a bullish shift) with a strong body. It says the sellers who drove price down have lost control.","Before the sweep, the lower highs were made by sellers. A close above the last lower high means buyers absorbed that supply. Structure is the footprint of who is in charge.","A real candle body close (not just a wick) above the last lower high, usually with displacement.","Enter only after MSS, and look for the order block or FVG left behind by the move.",()=>`Candle 39 closed at ${f(C[39].c)}, above the lower high at ${f(swH)}. That is the MSS confirming the sweep.`,"mss"],
["ob","Order Block (OB)","The last opposite candle before a strong displacement. For longs: the last down candle before the move up.","That candle is where large orders were building positions. When price returns, unfilled orders and defenders step in again.","Last down candle before an impulse that also breaks structure. Use its body, or its 50%, as the zone.","Buy limit near the OB, stop just below it. If price closes through the whole block, the idea is dead.",()=>`Candle 35 is the last down candle before the rally. Its zone ${f(OB[0])}–${f(OB[1])} is the Bullish OB.`,"ob"],
["fvg","Fair Value Gap (FVG)","A three-candle gap where candle 1’s high and candle 3’s low do not overlap. Price moved so fast that one side never traded.","Aggressive one-sided buying leaves inefficiency. Price often returns to rebalance it before continuing.","Candle 3’s low is above candle 1’s high (bullish). The gap between is the zone.","Use the gap’s 50% (consequent encroachment) as an entry or a reaction zone, with the OB below as the stop anchor.",()=>`Candle 38 high ${f(FVG[0])} and candle 40 low ${f(FVG[1])} leave a gap. Price is sitting inside it now at ${f(P)}.`,"fvg"],
["pd","Premium, Discount &amp; OTE","Split a range at 50%. Below is discount (buy area), above is premium (sell area). OTE is the 62–79% retracement.","Smart money buys cheap relative to the range and sells expensive. Buying in premium means paying up for the same asset.","Draw the swing low to swing high; the midpoint is equilibrium.","Longs only from discount in a bullish bias, shorts only from premium in a bearish one.",()=>`The session range midpoint is ${f(MID)}. The OB at ${f(OB[1])} is in deep discount, so longs are cheap there.`,"ob"],
["kz","Killzones &amp; timing","High-activity windows: London open and New York open. Moves that matter usually start here.","Liquidity and institutional order flow concentrate at the open of major sessions. Sweeps often happen at the open, then the real move follows.","London ~02:00–05:00 and NY ~07:00–10:00 New York time.","Trade the reaction inside killzones. Outside them, expect chop.",()=>`The sweep and displacement (candles 36–39) happened during the London killzone window.`,"sweep"]]],
["Volume Profile · where business was done",[
["poc","Point of Control (POC)","The price with the most traded volume in the session. A fair-price magnet.","Heavy volume means both sides agreed there. Price gravitates back to agreed value, and traders defend it.","The longest bar of the histogram.","Use the POC as a target when price is away from it, or as a pivot to watch for acceptance.",()=>`The POC is ${f(POC)}. Price is ${f(Math.abs(POC-P))} points away, so it works as a magnet target.`,"poc"],
["va","Value Area (VAH / VAL) &amp; 80% rule","The range holding ~70% of volume. VAH is the top, VAL the bottom.","Outside value, price is seen as cheap or expensive and attracts opposite interest. Acceptance back inside value tends to travel across it.","Expand from the POC until 70% of volume is included.","If price re-enters value from outside and holds for two 30m closes, it often rotates to the other side of value.",()=>`Value runs ${f(VAL)}–${f(VAH)}. The sweep low is below value, so a return into it targets the POC.`,"va"],
["hvn","HVN &amp; LVN","High volume nodes stall price. Low volume nodes (thin areas) get crossed quickly.","Little trade there means few orders to absorb the move, so price slices through.","Peaks and valleys on the histogram.","Take profit at HVNs, and expect speed through LVNs.",()=>`Thin volume sits below ${f(VAL)}. That is why the drop to the sweep low was fast and also why price left it quickly.`,"va"]]],

[/^Next: (London|New York|Asia) window in (\d+)h (\d+)m$/,(m,n,h,i)=>"បន្ទាប់៖ "+SN[n]+" ក្នុង "+h+"ម៉ោង "+i+"នាទី"],[/^(London|New York|Asia) window in (\d+)h (\d+)m$/,(m,n,h,i)=>SN[n]+" শিল্প "+h+"ម៉ោង "+i+"នាទី"],
[/^(\d+) of (\d+)$/,(m,a,b)=>a+" ក្នុង "+b],[/^Rating ([ABC])$/,(m,a)=>"ថ្នាក់ "+a],[/^(\d+) min ago$/,(m,a)=>a+" នាទីមុន"],[/^(\d+) h ago$/,(m,a)=>a=>a+" ម៉ោងមុន"],[/^Next: (London|New York|Asia) window/,(m,n)=>"បន្ទាប់៖ "+SN[n]],
[/^(London|New York) window is active$/,(m,n)=>"ម៉ោង "+SN[n]+" កំពុងសកម្ម"],[/^Outside the London and New York windows\. Next: (.+)$/,(m,x)=>"ក្រៅម៉ោងឡុងដ៍ និងញូវយ៉ក។ បន្ទាប់៖ "+x.replace(/(London|New York|Asia)/,k=>SN[k])],
[/^(.+) swept at (\{?[\d.,]+\}?)$/,(m,n,p)=>(KM[n]||n)+" ត្រូវបានបោសត្រង់ "+p],[/^Missing: (.+)\.$/,(m,x)=>"ខ្វះ៖ "+x+"។"],[/^Bullish idea\. /,()=>"គំនិតឡើង។ "],[/^Bearish idea\. /,()=>"គំនិតចុះ។ "]];
let km=false;try{km=localStorage.getItem("xk_lang")==="km"}catch(e){}
const orig=new WeakMap(),mine=new WeakMap();let busy=false,q=0;
function tr(t){const k=t.trim();if(!k)return t;if(KM[k])return t.replace(k,KM[k]);for(const[r,f]of RX){if(r.test(k))return t.replace(k,k.replace(r,f))}return t}
function walk(n){const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,{acceptNode:x=>/^(SCRIPT|STYLE|TEXTAREA)$/.test(x.parentNode.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const a=[];while(w.nextNode())a.push(w.currentNode);return a}
function run(){busy=true;try{walk(document.body).forEach(n=>{if(mine.has(n)&&n.nodeValue!==mine.get(n))orig.set(n,n.nodeValue);else if(!orig.has(n))orig.set(n,n.nodeValue);const o=orig.get(n);if(km){const t=tr(o);if(t!==o){n.nodeValue=t;mine.set(n,t)}else if(mine.has(n)){n.nodeValue=o;mine.delete(n)}}else if(mine.has(n)){n.nodeValue=o;mine.delete(n)}})}finally{busy=false}
document.documentElement.lang=km?"km":"en";const b=document.getElementById("lg");if(b)b.textContent=km?"EN":"ខ្មែរ"}
new MutationObserver(()=>{if(busy||q)return;q=requestAnimationFrame(()=>{q=0;run()})}).observe(document.body,{childList:true,subtree:true,characterData:true});
const h=document.querySelector("header");if(h){h.insertAdjacentHTML("beforeend",'<button class="chip" id="lg" aria-label="Language / ភាសា"></button>');document.getElementById("lg").onclick=()=>{km=!km;try{localStorage.setItem("xk_lang",km?"km":"en")}catch(e){}run()}}
run();
}catch(e){}})();
</script>
<script>
/* ---- Supabase Authentication & UI Integration ---- */
const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
let supabaseClient = null;

try {
  if (window.supabase && SUPABASE_URL !== 'YOUR_SUPABASE_URL_HERE') {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) {
  console.log("Supabase not initialized yet");
}

async function renderAuthModal() {
  const sheet = $("#sheet"), ov = $("#ov");
  if (!sheet || !ov) return;

  let user = null;
  if (supabaseClient) {
    const session = await supabaseClient.auth.getSession();
    user = session?.data?.session?.user || null;
  }

  if (user) {
    sheet.innerHTML = `
      <div class="row"><b class="big">Member Account</b><span class="chip g">Active</span></div>
      <p class="mut" style="margin-top:10px">Signed in as: <b>${user.email}</b></p>
      <div class="lb"><b>Terminal Access</b><br>Full institutional data feeds and ICT zone scanners unlocked.</div>
      <button class="go" id="logoutBtn" style="margin-top:14px">Sign Out</button>
    `;
    sheet.classList.add("on");
    ov.classList.add("on");
    $("#logoutBtn").onclick = async () => {
      if (supabaseClient) await supabaseClient.auth.signOut();
      sheet.classList.remove("on");
      ov.classList.remove("on");
      toast("Signed out successfully");
    };
  } else {
    sheet.innerHTML = `
      <div class="row"><b class="big">XAU.KH Portal</b><span class="chip">Member Access</span></div>
      <p class="mut" style="margin-top:6px">Sign in to sync your custom layouts, risk settings, and alerts across devices.</p>
      <div class="g2" style="margin-top:14px">
        <div><label>Email Address</label><input id="authEmail" type="email" placeholder="name@example.com"></div>
        <div><label>Password</label><input id="authPass" type="password" placeholder="••••••••"></div>
      </div>
      <div class="chips" style="margin-top:14px">
        <button class="chip on" id="loginSubmit">Sign In</button>
        <button class="chip" id="signupSubmit">Create Account</button>
      </div>
      <p class="tiny" style="margin-top:10px">Secured by Supabase Auth. Free tier member access.</p>
    `;
    sheet.classList.add("on");
    ov.classList.add("on");

    const handleAuth = async (isSignup) => {
      const email = $("#authEmail".value);
      const pass = $("#authPass").value;
      if (!email || !pass) {toast("Please enter email and password"); return;}
      if (!supabaseClient) {toast("Supabase keys not configured yet"); return;}
      
      try {
        const res = isSignup ? 
          await supabaseClient.auth.signUp({ email, password: pass }) :
          await supabaseClient.auth.signInWithPassword({ email, password: pass });
        
        if (res.error) throw res.error;
        toast(isSignup ? "Check your email for confirmation!" : "Successfully signed in!");
        sheet.classList.remove("on");
        ov.classList.remove("on");
      } catch (err) {
        toast("Error: " + err.message);
      }
    };

    $("#loginSubmit").onclick = () => handleAuth(false);
    $("#signupSubmit").onclick = () => handleAuth(true);
  }
}

document.addEventListener("click", e => {
  const btn = e.target.closest("#authBtn");
  if (btn) { renderAuthModal(); }
});
</script>
</body></html>
